services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: boh
      POSTGRES_PASSWORD: boh
      POSTGRES_DB: boh
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./init-test-db.sql:/docker-entrypoint-initdb.d/init.sql]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: boh
      MINIO_ROOT_PASSWORD: bohbohboh
    ports: ["9000:9000", "9001:9001"]
volumes:
  pgdata:
