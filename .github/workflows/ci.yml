name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: boh
          POSTGRES_PASSWORD: boh
          POSTGRES_DB: boh_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U boh" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://boh:boh@localhost:5432/boh_test
      TEST_DATABASE_URL: postgres://boh:boh@localhost:5432/boh_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      # xmllint (libxml2) independently checks the ZATCA invoice hash in the unit tests.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r --workspace-concurrency=1 test
